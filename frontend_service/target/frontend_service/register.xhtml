<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="title">Inscription</ui:define>
    <ui:define name="content">

        <div style="min-height:80vh;display:flex;align-items:center;justify-content:center;">
            <div style="width:100%;max-width:520px;">

                <div style="text-align:center;margin-bottom:28px;">
                    <div style="width:64px;height:64px;background:linear-gradient(135deg,#f7971e,#ffd200);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 24px rgba(247,151,30,0.4);font-size:1.8rem;">✨</div>
                    <h1 style="color:white;font-size:1.7rem;font-weight:800;margin-bottom:4px;">Créer un compte</h1>
                    <p style="color:rgba(255,255,255,0.6);font-size:0.95rem;">Rejoignez la plateforme SenExpertFormation</p>
                </div>

                <div class="glass-card">
                    <div style="padding:32px 36px;">
                        <h:form id="registerForm">
                            <p:messages id="msgs" showDetail="true" closable="true" style="margin-bottom:16px;border-radius:8px;"/>

                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
                                <div class="field" style="margin-bottom:0;">
                                    <label>Nom *</label>
                                    <p:inputText value="#{authBean.nom}" placeholder="Diallo"
                                                 required="true"
                                                 style="width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid #dee2e6;font-size:0.93rem;"/>
                                </div>
                                <div class="field" style="margin-bottom:0;">
                                    <label>Prénom *</label>
                                    <p:inputText value="#{authBean.prenom}" placeholder="Mamadou"
                                                 required="true"
                                                 style="width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid #dee2e6;font-size:0.93rem;"/>
                                </div>
                            </div>

                            <div class="field">
                                <label>Email *</label>
                                <p:inputText value="#{authBean.emailRegister}" placeholder="email@example.sn"
                                             required="true"
                                             style="width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid #dee2e6;font-size:0.93rem;"/>
                            </div>

                            <div class="field">
                                <label>Mot de passe *</label>
                                <p:password value="#{authBean.mdpRegister}" feedback="true"
                                            required="true" placeholder="Min. 6 caractères"
                                            style="width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid #dee2e6;font-size:0.93rem;"/>
                            </div>

                            <div class="field">
                                <label>Type de compte *</label>
                                <p:selectOneMenu value="#{authBean.role}"
                                                 style="width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid #dee2e6;font-size:0.93rem;">
                                    <f:selectItem itemValue="AGENT"       itemLabel="👔 Agent (représente une institution)"/>
                                    <f:selectItem itemValue="PARTICULIER" itemLabel="👤 Particulier"/>
                                </p:selectOneMenu>
                            </div>

                            <p:commandButton value="Créer mon compte →"
                                             action="#{authBean.register}"
                                             update="registerForm"
                                             style="width:100%;padding:12px;background:linear-gradient(135deg,#f7971e,#ffd200);border:none;border-radius:8px;color:#333;font-weight:700;font-size:0.95rem;cursor:pointer;box-shadow:0 4px 15px rgba(247,151,30,0.4);margin-top:4px;"/>

                            <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid #f0f0f0;">
                                <span style="color:#888;font-size:0.88rem;">Déjà un compte ? </span>
                                <h:link outcome="/login" value="Se connecter"
                                        style="color:#0072ff;font-weight:600;font-size:0.88rem;text-decoration:none;"/>
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>

    </ui:define>
</ui:composition>
</html>
