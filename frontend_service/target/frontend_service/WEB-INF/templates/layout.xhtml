<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SenExpertFormation — <ui:insert name="title">Plateforme</ui:insert></title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            color: #333;
        }

        /* ── TOPBAR ── */
        .topbar {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .topbar-brand .logo-circle {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 2px 10px rgba(0,114,255,0.4);
        }
        .topbar-brand .brand-text {
            color: white;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .topbar-brand .brand-sub {
            color: rgba(255,255,255,0.55);
            font-size: 0.7rem;
            display: block;
            line-height: 1;
        }
        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-link {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.15);
            color: white;
        }
        .nav-link.active {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
        }
        .nav-badge {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #333;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .nav-user {
            color: rgba(255,255,255,0.9);
            font-size: 0.85rem;
            padding: 6px 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-user .avatar {
            width: 26px; height: 26px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
        }

        /* ── PAGE WRAPPER ── */
        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 36px 24px;
        }

        /* ── GLASS CARD ── */
        .glass-card {
            background: rgba(255,255,255,0.97);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .glass-card-header {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            padding: 24px 32px;
            color: white;
        }
        .glass-card-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .glass-card-header p {
            font-size: 0.9rem;
            opacity: 0.85;
        }
        .glass-card-body {
            padding: 28px 32px;
        }

        /* ── PAGE TITLE ── */
        .page-title {
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .page-subtitle {
            color: rgba(255,255,255,0.65);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        /* ── STATUT BADGES ── */
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
        .badge-wait    { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
        .badge-ok      { background: #d1e7dd; color: #0a5c36; border: 1px solid #198754; }
        .badge-ko      { background: #f8d7da; color: #842029; border: 1px solid #dc3545; }
        .badge-online  { background: #cfe2ff; color: #084298; border: 1px solid #0d6efd; }
        .badge-custom  { background: #e2d9f3; color: #432874; border: 1px solid #6f42c1; }

        /* ── MESSAGES ── */
        .msg-success { background: #d1e7dd; border: 1px solid #a3cfbb; color: #0a5c36; padding: 12px 16px; border-radius: 8px; margin-bottom: 14px; font-size: 0.9rem; }
        .msg-error   { background: #f8d7da; border: 1px solid #f1aeb5; color: #842029; padding: 12px 16px; border-radius: 8px; margin-bottom: 14px; font-size: 0.9rem; }

        /* ── FORM FIELDS ── */
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 0.85rem; font-weight: 600; color: #444; margin-bottom: 6px; }
        .ui-inputfield, .ui-selectonemenu { width: 100% !important; border-radius: 8px !important; border: 1.5px solid #dee2e6 !important; padding: 9px 13px !important; font-size: 0.93rem !important; transition: border-color 0.2s !important; }
        .ui-inputfield:focus, .ui-selectonemenu:focus { border-color: #0072ff !important; box-shadow: 0 0 0 3px rgba(0,114,255,0.15) !important; }

        /* ── BTN ── */
        .btn-primary { background: linear-gradient(135deg, #0072ff, #00c6ff) !important; border: none !important; border-radius: 8px !important; padding: 10px 24px !important; font-weight: 600 !important; font-size: 0.93rem !important; color: white !important; box-shadow: 0 4px 15px rgba(0,114,255,0.35) !important; transition: all 0.2s !important; cursor: pointer; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,114,255,0.45) !important; }
        .btn-success { background: linear-gradient(135deg, #198754, #28a745) !important; border: none !important; border-radius: 6px !important; color: white !important; }
        .btn-danger  { background: linear-gradient(135deg, #dc3545, #c82333) !important; border: none !important; border-radius: 6px !important; color: white !important; }
        .btn-full { width: 100% !important; justify-content: center !important; }

        /* ── TABLE ── */
        .ui-datatable { border-radius: 12px !important; overflow: hidden !important; border: none !important; }
        .ui-datatable thead th { background: linear-gradient(135deg, #0072ff, #00c6ff) !important; color: white !important; font-weight: 600 !important; border: none !important; padding: 13px 16px !important; }
        .ui-datatable tbody tr:nth-child(even) { background: #f8faff !important; }
        .ui-datatable tbody tr:hover { background: #e8f1ff !important; }
        .ui-datatable tbody td { border: none !important; border-bottom: 1px solid #f0f0f0 !important; padding: 12px 16px !important; }

        /* ── INFO BOX ── */
        .info-box { background: linear-gradient(135deg, #e8f4fd, #dbeafe); border: 1px solid #bfdbfe; border-radius: 10px; padding: 14px 18px; font-size: 0.88rem; color: #1e40af; margin-top: 16px; }

        /* ── OFFER CARD ── */
        .offer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 8px; }
        .offer-card { background: white; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
        .offer-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .offer-card-top { padding: 20px 20px 14px; border-bottom: 1px solid #f0f0f0; }
        .offer-card-top h3 { font-size: 1rem; font-weight: 700; color: #1e3a5f; margin-bottom: 6px; }
        .offer-card-bottom { padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
        .offer-meta { font-size: 0.8rem; color: #888; margin-top: 4px; }
        .offer-stripe { height: 4px; background: linear-gradient(135deg, #0072ff, #00c6ff); }

        /* ── TABS ── */
        .ui-tabview-nav li.ui-tabview-selected a { color: #0072ff !important; font-weight: 700 !important; border-bottom: 3px solid #0072ff !important; }

        /* ── LINK ── */
        a.subtle-link { color: rgba(255,255,255,0.7); font-size: 0.85rem; text-decoration: none; }
        a.subtle-link:hover { color: white; }
    </style>
</h:head>

<h:body>

    <!-- ══ TOPBAR ══ -->
    <nav class="topbar">
        <a class="topbar-brand" href="#{request.contextPath}/offres.xhtml">
            <div class="logo-circle">🎓</div>
            <div>
                <span class="brand-text">SenExpertFormation</span>
                <span class="brand-sub">Plateforme de Formations</span>
            </div>
        </a>

        <div class="topbar-nav">
            <a class="nav-link" href="#{request.contextPath}/offres.xhtml">📚 Offres</a>

            <h:panelGroup rendered="#{sessionBean.connecte and !sessionBean.admin}">
                <a class="nav-link" href="#{request.contextPath}/institution.xhtml">🏢 Mon Institution</a>
            </h:panelGroup>

            <h:panelGroup rendered="#{sessionBean.admin}">
                <a class="nav-link" href="#{request.contextPath}/admin/dashboard.xhtml">🛡 Administration</a>
            </h:panelGroup>

            <h:panelGroup rendered="#{!sessionBean.connecte}">
                <a class="nav-link" href="#{request.contextPath}/login.xhtml">🔐 Connexion</a>
                <a class="nav-link active" href="#{request.contextPath}/register.xhtml">✨ S'inscrire</a>
            </h:panelGroup>

            <h:panelGroup rendered="#{sessionBean.connecte}" style="display:flex;align-items:center;gap:8px;">
                <span class="nav-user">
                    <span class="avatar">#{sessionBean.email != null ? sessionBean.email.substring(0,1).toUpperCase() : 'U'}</span>
                    #{sessionBean.email}
                </span>
                <h:form style="display:inline;margin:0;">
                    <h:commandLink styleClass="nav-link" style="display:inline-block;"
                                   value="⏻ Quitter" action="#{authBean.logout}"/>
                </h:form>
            </h:panelGroup>
        </div>
    </nav>

    <!-- ══ CONTENT ══ -->
    <div class="page-wrapper">
        <p:messages showDetail="true" closable="true" style="margin-bottom:16px; border-radius:10px;"/>
        <ui:insert name="content"/>
    </div>

</h:body>
</html>
