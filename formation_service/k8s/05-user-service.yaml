##############################################
# Deployment — user-service
##############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: senexpert
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: senexpert/user-service:latest
          # Pour un cluster local (minikube) : imagePullPolicy: Never
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: senexpert-config
                  key: db-users-url
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: senexpert-config
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: senexpert-secret
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: senexpert-secret
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
##############################################
# Service — user-service (NodePort accessible de l'extérieur)
##############################################
apiVersion: v1
kind: Service
metadata:
  name: user-service-svc
  namespace: senexpert
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
  type: NodePort
