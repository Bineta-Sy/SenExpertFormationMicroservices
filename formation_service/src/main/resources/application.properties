spring.application.name=formation_service
# Exclure l'auto-config UserDetailsService (formation_service est un resource server JWT pur, pas d'auth locale)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/formation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:bineta28j03}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:6A576E5A7234753778214125442A472D4B6150645367566B59703373367639792F423F4528482B4D6251655468576D5A71}

# URL du user_service (surchargeable via variable d'environnement Docker/K8s)
user-service.url=${USER_SERVICE_URL:http://localhost:8081}

# ── Configuration email ──────────────────────────────────────────────────────
# Fournisseur SMTP configurable via variables d'environnement (Docker/K8s/prod)
# Exemple Gmail : MAIL_HOST=smtp.gmail.com, MAIL_PORT=587
# Exemple senexpert SMTP : MAIL_HOST=smtp.senexpert.sn
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@senexpert.sn}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Désactiver l'envoi si MAIL_ENABLED=false (utile en dev/test)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:SenExpertFormation &lt;noreply@senexpert.sn&gt;}

# Exclure le health check mail (SMTP non configuré en dev)
management.health.mail.enabled=false

# ── Upload de fichiers ───────────────────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:/uploads}
# Taille max d'un fichier uploadé (100 Mo)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB
